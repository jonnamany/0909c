  <!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 이쁜 웹사이트</title>
    <style>
        /* 1. 전체 화면 기본 세팅 */
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f8f9fa; /* 은은한 밝은 회색 배경 */
            color: #333333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 2. 가운데 정렬된 하얀색 카드 박스 */
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 20px; /* 둥근 모서리 */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); /* 부드러운 그림자 효과 */
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        /* 3. 제목 스타일 */
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #111111;
        }

        /* 4. 본문 설명 글씨 스타일 */
        p {
            font-size: 16px;
            color: #666666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* 5. ⭐️ 가장 중요한 이쁜 버튼 (링크) 스타일 */
        .btn-link {
            display: inline-block;
            text-decoration: none;
            background-color: #4f46e5; /* 세련된 보라/블루 톤 */
            color: white;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.2s ease-in-out; /* 부드러운 애니메이션 효과 */
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
        }

        /* 6. 마우스를 올렸을 때(Hover) 효과 */
        .btn-link:hover {
            background-color: #4338ca; /* 좀 더 어두운 보라색으로 변경 */
            transform: translateY(-2px); /* 살짝 위로 떠오르는 효과 */
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
        }
    </style>
</head>
<body>

    <!-- 화면 가운데 정렬을 위한 컨테이너 박스 -->
    <div class="container">
        <h1>Welcome! 🌟</h1>
        <p>개인적으로 활용하기 위한 <br>축구팀, 풋살팀 팀 편성기</p>
        
        <!-- 클래스(class)를 주어 이쁜 버튼으로 변신시킵니다 -->
        <a href="ns_team_maker.html" class="btn-link">넉살FC 팀 평성기</a>
        <a href="mf_team_maker.html" class="btn-link">목요풋살 팀 편성기</a>

    <!-- 클릭하면 sub.html로 이동하는 링크
    <p><a href="sub.html">현재 페이지에서 열기</a></p>
    <a href="sub.html" target="_blank">새창으로 열기</a> -->


    </div>

</body>
</html>
